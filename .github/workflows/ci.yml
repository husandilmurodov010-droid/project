name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile bot.py config.py database.py gemini_pool.py health_server.py watchdog.py backup.py

      - name: Import smoke test
        env:
          BOT_TOKEN: "123:TEST"
          GEMINI_API_KEYS: "dummy"
        run: |
          python -c "import config, gemini_pool, database, health_server, watchdog; print('imports ok')"

      - name: Validate JSON data files
        run: |
          for f in *.json; do python -c "import json,sys; json.load(open('$f'))" && echo "OK $f"; done

      - name: Validate YAML
        run: python -c "import yaml; yaml.safe_load(open('render.yaml'))"

      - name: Security - no secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$'; then
            echo "::error:: .env yoki *.db commit qilingan!"; exit 1
          fi
          echo "secrets check ok"
