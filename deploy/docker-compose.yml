# ===========================================================================
#  AI Manager Bot — Docker Compose (VPS / lokal uchun 24/7)
#  Ishlatish (repo ildizidan):
#      docker compose -f deploy/docker-compose.yml up -d --build
#  Loglar:
#      docker compose -f deploy/docker-compose.yml logs -f --tail=100
#
#  ⚠️ Bu variant VPS uchun — bu yerda DISK DOIMIY (volume), shuning uchun
#     GitHub Gist zaxirasi shart emas (BACKUP_ENABLED=false bo'lishi mumkin).
# ===========================================================================

services:
  manga-bot:
    build:
      context: ..                       # repo ildizi (kod shu yerdan olinadi)
      dockerfile: deploy/Dockerfile
    image: ai-manager-bot:latest
    container_name: ai-manager-bot

    # Konteyner yiqilsa yoki server qayta yuklansa — o'zi qayta ko'tariladi
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      # Disk (volume) ishlatilgani uchun baza doimiy saqlanadi
      - DB_PATH=/app/data/bot.db
      - ENABLE_HEALTH_SERVER=false      # VPS'da health-check shart emas
      - BACKUP_ENABLED=false            # disk doimiy -> Gist kerak emas
      - TZ=Asia/Tashkent

    volumes:
      - ../data:/app/data               # baza (doimiy!)
      - ../logs:/app/logs               # loglar

    # Log hajmini cheklash — disk to'lib qolmasin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Resurs chegaralari (kichik VPS uchun xavfsiz)
    deploy:
      resources:
        limits:
          memory: 512M
