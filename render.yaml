# Render Blueprint - AI Manager Bot (@AIManagerProBot)
# Render Dashboard -> New + -> Blueprint -> connect this repo.
services:
  - type: web
    name: project
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3.8-flash,gemini-flash-latest
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SELF_PING_ENABLED
        value: "true"
      - key: SELF_PING_INTERVAL
        value: "600"
      - key: HISTORY_TURNS
        value: "8"
      - key: WATCHDOG_ENABLED
        value: "true"
      - key: WATCHDOG_MEMORY_LIMIT_MB
        value: "400"
      - key: ENABLE_INSTANT_REPLIES
        value: "true"
      - key: ENABLE_IMAGE_GEN
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # WEBHOOK_BASE_URL is bound to Render's own public URL automatically.
      - key: WEBHOOK_BASE_URL
        fromService:
          name: project
          type: web
          envVarKey: RENDER_EXTERNAL_URL
